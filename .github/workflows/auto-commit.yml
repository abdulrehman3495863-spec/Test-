name: Daily Auto Commit

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Make changes
        run: |
          echo "Updated on: $(date)" > update.txt
      - name: Commit and push
        run: |
          git config user.name "Abdul Rehman"
          git config user.email "abdulehman3495863-spec@users.noreply.github.com"
          git add .
          git commit -m "Auto commit: $(date)" || echo "No changes"
          git push
